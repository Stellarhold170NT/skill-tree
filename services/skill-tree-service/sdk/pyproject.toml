[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh_web_sdk"
version = "0.3.0"
description = "Async Python SDK for DeepSeek Harness web server"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["dsh_web_sdk*"]
