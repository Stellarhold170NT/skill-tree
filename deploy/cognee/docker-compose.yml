services:
  # =========================================================================
  # Cognee Server & MCP Service (Module M8 - Classroom Memory Engine)
  # Phục vụ cho skill-tree-service qua giao thức MCP (Streamable HTTP) tại /mcp
  # Hợp đồng: http://localhost:8021/mcp
  # REST Docs: http://localhost:8021/docs
  # =========================================================================
  cognee:
    image: cognee/cognee:main
    container_name: skilltree-cognee
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Chế độ MCP Streamable-HTTP tại /mcp
      TRANSPORT_MODE: http
      MCP_ALLOWED_HOSTS: "*:*"
      ENV: local

      # Provider LLM (OpenAI-compatible qua 9Router / NetMind gateway)
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-openai/netmind/zai-org/GLM-5.3-Flash}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-http://host.docker.internal:20128/v1}

      # Local-first FastEmbed (theo ADR 0001)
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-none}

      # Quyền và bảo mật nội bộ
      ENABLE_BACKEND_ACCESS_CONTROL: ${ENABLE_BACKEND_ACCESS_CONTROL:-false}
      COGNEE_SKIP_CONNECTION_TEST: ${COGNEE_SKIP_CONNECTION_TEST:-true}

      # Port dịch vụ trong container
      HTTP_PORT: 8000
      BIND_ADDRESS: "0.0.0.0"
    ports:
      # Cổng 8021 phục vụ cả MCP (/mcp) và REST Docs (/docs)
      - "${COGNEE_MCP_PORT:-8021}:8000"
    volumes:
      - cognee-data:/cognee-storage
    networks:
      - cognee-net
      - platform-net

volumes:
  cognee-data:
    name: skilltree_cognee-data

networks:
  cognee-net:
    name: skilltree_cognee-net
    driver: bridge
  platform-net:
    name: deploy_platform-net
    external: true
